services:
  backend:
    build: ./backend
    container_name: compilador_backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/saude', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: compilador_frontend
    ports:
      - "8501:80"        # interface em http://localhost:8501
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Testes do frontend (Node + jsdom). Uso: docker compose run --rm testes-frontend
  testes-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    profiles: ["test"]
